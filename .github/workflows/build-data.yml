name: Build and validate data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build datasets from official World Bank source
        run: python scripts/run_pipeline.py

      - name: Run tests
        run: pytest -q

      - name: Commit generated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fy23_climate_projects.csv data/fy23_climate_projects_enriched.csv data/country_climate_finance_vs_ndgain.csv
          if git diff --cached --quiet; then
            echo "No generated-data changes to commit."
          else
            git commit -m "Build and validate climate finance datasets"
            git push
          fi
